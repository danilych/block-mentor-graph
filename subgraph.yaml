specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TokenFactory
    network: arbitrum-sepolia
    source:
      address: "0x114b314f3925a681ed729743b31f92dd157Ff2c5"
      abi: TokenFactory
      startBlock: 135004396
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - OwnershipTransferred
        - TokenCreated
      abis:
        - name: TokenFactory
          file: ./abis/TokenFactory.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: TokenCreated(indexed address,indexed address,string,string,uint256)
          handler: handleTokenCreated
        - event: OmnichainTokenCreated(indexed address,indexed address,string,string,uint256)
          handler: handleOmnichainTokenCreated
      file: ./src/token-factory.ts
  - kind: ethereum
    name: VestingFactory
    network: arbitrum-sepolia
    source:
      address: "0x512d34BD76ED3F3292a9Fd1C80b7b35927726bb5"
      abi: VestingFactory
      startBlock: 135035084
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VestingScheduleCreated
      abis:
        - name: VestingFactory
          file: ./abis/VestingFactory.json
      eventHandlers:
        - event: VestingScheduleCreated(indexed address,indexed address,uint256,uint256,uint256,uint256,string,string,address)
          handler: handleVestingScheduleCreated
      file: ./src/vesting-factory.ts


